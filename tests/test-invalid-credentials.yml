name: Test invalid credentials handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          heroku_api_key: "00000000-0000-0000-0000-000000000000"
          heroku_email: "invalid@example.com"
          heroku_app_name: "nonexistent-app-harness-test"
      - name: Assert action fails gracefully with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, check that status output is set
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status='$STATUS'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
