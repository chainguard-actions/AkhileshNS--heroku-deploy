name: Test dontautocreate option (graceful failure with invalid credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up fake heroku CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\necho "Error: Invalid credentials provided." >&2\nexit 1\n' > "$HOME/.local/bin/heroku"
          chmod +x "$HOME/.local/bin/heroku"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          heroku_api_key: fake-api-key-for-testing
          heroku_email: test@example.com
          heroku_app_name: test-app-harness
          dontautocreate: "true"
      - name: Assert action ran with dontautocreate and produced expected outcome
        env:
          STATUS: ${{ steps.action.outputs.status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "status: $STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$STATUS" ]; then
              echo "FAIL: action succeeded but status output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with status='$STATUS'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials and dontautocreate=true)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
